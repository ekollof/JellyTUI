[project]
name = "jellytui"
version = "0.1.0"
description = "A keyboard-driven Jellyfin TUI with mpv playback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.0",
    "textual-image>=0.14.3",
    "requests>=2.28",
    "numpy>=1.26",
]

[project.scripts]
jellytui = "jellytui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jellytui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM117"]
